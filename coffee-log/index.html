<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>mame — コーヒー豆ノート</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="mame ホーム"><span class="brand-icon">豆</span><span>mame<span class="brand-dot">.</span></span></a>
        <span class="top-note"><span class="bean-dot"></span> YOUR COFFEE JOURNAL</span>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">A LITTLE ARCHIVE OF GOOD CUPS</p>
          <h1>好きな一杯を、<br /><span>忘れないように。</span></h1>
          <p class="hero-sub">飲んだ豆のこと、味わった時間のこと。<br class="mobile-break" />お気に入りの記録をここに。</p>
        </div>
        <div class="hero-art" aria-hidden="true"><div class="sun"></div><div class="cup"><div class="coffee"></div><div class="cup-handle"></div></div><div class="steam steam-one"></div><div class="steam steam-two"></div><span class="art-leaf leaf-one">✳</span><span class="art-leaf leaf-two">✦</span></div>
      </section>

      <section class="stats" aria-label="記録の概要">
        <div class="stat"><span class="stat-label">記録した豆</span><strong id="bean-count">0</strong><span class="stat-unit">種類</span></div>
        <span class="stat-divider"></span>
        <div class="stat"><span class="stat-label">平均コスパ</span><strong id="average-cost">—</strong><span class="stat-unit">円 / g</span></div>
        <span class="stats-bean" aria-hidden="true">☕</span>
      </section>

      <section class="records" aria-labelledby="records-title">
        <div class="section-head">
          <div><p class="eyebrow">YOUR TASTING NOTES</p><h2 id="records-title">豆の記録</h2></div>
          <button class="primary-button" id="open-form" type="button"><span>＋</span> 豆を記録</button>
        </div>

        <div class="toolbar">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="豆・お店・生産国で検索" aria-label="記録を検索" /></label>
          <label class="sort-control"><span>並び替え</span><select id="sort-select" aria-label="記録の並び替え"><option value="newest">新しく記録した順</option><option value="rating">評価が高い順</option><option value="cost">コスパが良い順</option></select></label>
        </div>

        <form class="entry-form" id="bean-form" hidden>
          <div class="form-heading"><div><p class="eyebrow">NEW TASTING NOTE</p><h3>新しい豆を記録</h3></div><button class="close-button" id="close-form" type="button" aria-label="フォームを閉じる">×</button></div>
          <div class="form-grid">
            <label class="field field-wide">豆の名前<input name="name" maxlength="60" placeholder="例：エチオピア イルガチェフェ" required /></label>
            <label class="field">購入店舗<input name="store" maxlength="60" placeholder="例：近所のロースター" /></label>
            <label class="field">焙煎度<select name="roast"><option value="">選択してください</option><option>浅煎り</option><option>中浅煎り</option><option>中煎り</option><option>中深煎り</option><option>深煎り</option></select></label>
            <label class="field">内容量 <span class="field-unit">g</span><input name="grams" type="number" min="1" max="99999" step="1" placeholder="200" required /></label>
            <label class="field">値段 <span class="field-unit">円</span><input name="price" type="number" min="1" max="9999999" step="1" placeholder="1800" required /></label>
            <label class="field field-wide">生産国 <span class="field-hint">最大3つ・複数の場合はカンマ区切り</span><input name="countries" maxlength="100" placeholder="例：エチオピア、ケニア" /></label>
            <fieldset class="field field-wide rating-field"><legend>味の評価</legend><div class="stars" role="radiogroup" aria-label="味の評価 1から5"><label><input type="radio" name="rating" value="1" /><span>★</span></label><label><input type="radio" name="rating" value="2" /><span>★</span></label><label><input type="radio" name="rating" value="3" /><span>★</span></label><label><input type="radio" name="rating" value="4" /><span>★</span></label><label><input type="radio" name="rating" value="5" checked /><span>★</span></label><span class="rating-hint">星を選んでください</span></div></fieldset>
            <label class="field field-wide">味のメモ<textarea name="note" rows="3" maxlength="500" placeholder="香りや酸味、甘みなど。自由にメモできます。"></textarea></label>
          </div>
          <p class="cost-preview" id="cost-preview">コスパ <strong>—</strong> <span>円 / g</span></p>
          <div class="form-actions"><button class="text-button" id="cancel-form" type="button">キャンセル</button><button class="primary-button" type="submit">記録を保存</button></div>
        </form>

        <div class="bean-list" id="bean-list"></div>
        <div class="empty-state" id="empty-state" hidden><span class="empty-cup" aria-hidden="true">☕</span><h3 id="empty-title">最初の一杯を記録しましょう</h3><p id="empty-copy">飲んだ豆の名前や味の印象を、あとから見返せるように。</p><button class="primary-button" id="empty-add" type="button"><span>＋</span> 豆を記録する</button></div>
      </section>

      <footer><span>一杯ずつ、好きが増えていく。</span><strong>mame.</strong></footer>
    </main>

    <template id="bean-template">
      <article class="bean-card">
        <div class="bean-avatar" aria-hidden="true">☕</div>
        <div class="bean-main"><div class="bean-topline"><div class="bean-title-wrap"><h3 class="bean-name"></h3><span class="roast-pill"></span></div><div class="card-stars" aria-label="評価"></div></div>
          <p class="bean-meta"><span class="bean-store"></span><span class="meta-separator">·</span><span class="bean-countries"></span></p>
          <p class="bean-note"></p>
          <div class="bean-bottom"><span class="bean-amount"></span><span class="bean-price"></span><strong class="bean-cost"></strong></div>
        </div>
        <button class="delete-button" type="button" aria-label="この記録を削除" title="削除">×</button>
      </article>
    </template>
  </body>
</html>
